name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Used by the comment workflow to run on a PR head
  workflow_dispatch: {}

permissions:
  pull-requests: read
  contents: read

env:
  NODE_VERSION: 20.x
  CI: true

jobs:
  check-should-run:
    name: Check if should run
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.should-run.outputs.run-tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For PR events, use the PR head SHA; otherwise use the event SHA
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: should-run
        name: Decide whether to run tests
        run: |
          # If triggered manually (workflow_dispatch), always run the tests
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For push / pull_request, inspect the latest commit message
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          echo "Last commit message:"
          echo "$COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"[integration]"* ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Integration tests skipped - commit message does not contain '[integration]'"
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: check-should-run
    # Only run if the previous job decided we should
    if: needs.check-should-run.outputs.run-tests == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm ci

      - name: Run command
        run: npm test
