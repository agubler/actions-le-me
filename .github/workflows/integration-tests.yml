name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  contents: read

env:
  NODE_VERSION: 20.x
  CI: true

jobs:
  check-should-run:
    name: Check if should run
    runs-on: ubuntu-latest

    # Only run for PRs (not issues) when triggered by issue_comment, and only if comment is /integration
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.body == '/integration')

    steps:
      - name: Checkout repository
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v4
        with:
          # On PR events, checkout the PR HEAD commit; otherwise use the event SHA
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for commit tag
        if: github.event_name != 'issue_comment'
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          if [[ "$COMMIT_MSG" != *"[integration]"* ]]; then
            echo "::notice::Integration tests skipped - commit message does not contain '[integration]' tag"
            exit 1
          fi

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: check-should-run
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run command
        working-directory: .
        run: npm test
