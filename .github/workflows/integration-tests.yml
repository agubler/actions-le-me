name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

env:
  NODE_VERSION: 20.x
  CI: true

jobs:
  check-should-run:
    name: Check if should run
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.decision.outputs.run-tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: decision
        name: Decide whether to run tests
        run: |
          EVENT="${{ github.event_name }}"
          ATTEMPT='${{ github.run_attempt }}'

          echo "Event: $EVENT"
          echo "Run attempt: $ATTEMPT"

          COMMIT_MSG="$(git log -1 --pretty=%B)"
          echo "Commit message:"
          echo "$COMMIT_MSG"

          SHOULD_RUN=false

          # 1) If commit message has [integration], always run tests
          if [[ "$COMMIT_MSG" == *"[integration]"* ]]; then
            SHOULD_RUN=true
          # 2) If this is a re-run (run_attempt > 1) on a PR, allow tests even without the tag
          elif [ "$EVENT" = "pull_request" ] && [ "$ATTEMPT" -gt 1 ]; then
            echo "Re-run detected for PR – allowing integration tests without [integration] tag."
            SHOULD_RUN=true
          fi

          if [ "$SHOULD_RUN" = "true" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Integration tests MUST be explicitly triggered using '[integration]' in the commit message."
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: check-should-run
    if: needs.check-should-run.outputs.run-tests == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install

      - name: Run integration tests
        run: npm test
