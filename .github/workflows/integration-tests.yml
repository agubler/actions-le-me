name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: read
  contents: read

env:
  NODE_VERSION: 20.x
  CI: true

jobs:
  check-should-run:
    name: Check if should run
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.decision.outputs.run-tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for /integration override comment
        if: github.event_name == 'pull_request'
        id: comment-check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );

            const hasIntegrationComment = comments.some(
              (c) => c.body.trim() === '/integration'
            );

            core.info(`Has /integration comment: ${hasIntegrationComment}`);
            core.setOutput(
              'has-integration-comment',
              hasIntegrationComment ? 'true' : 'false'
            );

      - id: decision
        name: Decide whether to run tests
        run: |
          EVENT="${{ github.event_name }}"
          echo "Event: $EVENT"

          HAS_COMMENT="${{ steps.comment-check.outputs.has-integration-comment || 'false' }}"

          COMMIT_MSG="$(git log -1 --pretty=%B)"
          echo "Commit message:"
          echo "$COMMIT_MSG"

          SHOULD_RUN=false

          if [[ "$COMMIT_MSG" == *"[integration]"* ]]; then
            SHOULD_RUN=true
          elif [[ "$EVENT" == "pull_request" && "$HAS_COMMENT" == "true" ]]; then
            SHOULD_RUN=true
          fi

          if [ "$SHOULD_RUN" = "true" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Integration tests MUST be explicitly triggered using '[integration]' in the commit message or a '/integration' comment."
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: check-should-run
    if: needs.check-should-run.outputs.run-tests == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install

      - name: Run integration tests
        run: npm test
