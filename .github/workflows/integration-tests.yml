name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  pull-requests: read
  contents: read

env:
  NODE_VERSION: 20.x
  CI: true

jobs:
  check-should-run:
    name: Check if should run
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.should-run.outputs.run-tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: should-run
        name: Decide whether to run tests
        run: |
          echo "Event: ${{ github.event_name }}"

          # Manual trigger? Always run tests
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MSG="$(git log -1 --pretty=%B)"
          echo "Commit message:"
          echo "$COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"[integration]"* ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Integration tests MUST be explicitly triggered using '[integration]' in the commit message."
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            exit 1   # <--- FAIL the check
          fi

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: check-should-run
    if: needs.check-should-run.outputs.run-tests == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install

      - name: Run integration tests
        run: npm test
