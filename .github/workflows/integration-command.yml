name: Integration Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  actions: write # Needed to call createWorkflowDispatch

jobs:
  trigger-integration-tests:
    name: Trigger Integration Tests from comment
    runs-on: ubuntu-latest

    # Only run when:
    # - the comment is on a PR (not a plain issue)
    # - the comment text is exactly `/integration`
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/integration'

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            core.setOutput('head_ref', pr.head.ref);

      - name: Dispatch Integration Tests workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // This must match the filename of the main workflow
            const workflow_id = 'integration-tests.yml';

            const headRef = '${{ steps.pr.outputs.head_ref }}';

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: headRef,
            });

            core.info(`Dispatched ${workflow_id} on ref ${headRef}`);
