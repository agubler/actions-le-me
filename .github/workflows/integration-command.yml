name: Integration Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  trigger-integration-tests:
    name: Trigger Integration Tests from comment
    runs-on: ubuntu-latest

    # Only when:
    # - the comment is on a PR
    # - the comment text is exactly `/integration`
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/integration'

    steps:
      - name: Re-run latest Integration Tests for this PR & commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
            const workflowFileName = 'integration-tests.yml';

            // Get the workflow
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: workflowFileName,
            });

            // Get PR info
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const headRef = pr.head.ref;
            const headSha = pr.head.sha;

            // Find the latest run for this workflow, on this branch AND this SHA
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflow.id,
                event: 'pull_request',
                branch: headRef,
                per_page: 50,
              }
            );

            const run = runs.find(r => r.head_sha === headSha);

            if (!run) {
              core.setFailed(`No Integration Tests pull_request run found for PR #${prNumber} at SHA ${headSha}`);
              return;
            }

            core.info(`Re-running workflow run ${run.id} for PR #${prNumber} (SHA ${headSha})`);

            await github.rest.actions.reRunWorkflow({
              owner,
              repo,
              run_id: run.id,
            });

      - name: React to comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const commentId = context.payload.comment.id;

            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: commentId,
              content: 'rocket',
            });
